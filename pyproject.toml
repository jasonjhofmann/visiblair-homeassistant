# Tool configuration only — the integration itself is loaded by Home
# Assistant from custom_components/visiblair/, not pip-installed. There
# is intentionally no [project] section here.

[tool.ruff]
line-length = 88
# Must match the OLDEST supported interpreter, NOT the newest — the rule
# that 0.6.2 broke. The hacs.json floor is now HA 2026.7.0, whose
# pyproject declares requires-python = ">=3.14.2", so the oldest
# supported interpreter IS 3.14. Consequence: ruff format's rewrite of
# `except (A, B):` into unparenthesized PEP 758 syntax is now correct
# output rather than the 0.6.2 regression — that syntax no longer
# outruns any interpreter we support.
target-version = "py314"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line-too-long — defer to ruff format
    "SIM108", # ternary-instead-of-if — clarity sometimes beats brevity
    "RUF001", # ambiguous-unicode-character-string — em/en dashes in prose
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # pytest uses assert intentionally

[tool.mypy]
# Matches the installed (current) Home Assistant source, which itself
# uses 3.14-only syntax. Since the HA 2026.7.0 floor requires Python
# >=3.14.2, this now coincides with the support floor rather than
# running ahead of it. OUR code's floor stays independently enforced by
# ruff target-version and CI's compileall job.
python_version = "3.14"
strict = true
warn_unreachable = true
# Modern HA's stubs aren't published; rely on its installed source. The
# overrides below suppress missing-imports for runtime-only packages.

[[tool.mypy.overrides]]
module = [
    "homeassistant.*",
    "voluptuous",
    "pytest",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
