name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so drift in the latest Home Assistant shows up the day it lands
    # instead of at the next push.
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Ruff (lint)
        run: |
          uv run --python 3.14 --with ruff \
            ruff check custom_components/ tests/

      - name: Ruff (format check)
        run: |
          uv run --python 3.14 --with ruff \
            ruff format --check custom_components/ tests/

  # Compiles every module on the exact interpreter implied by the declared
  # support floor (hacs.json: HA 2026.7.0 -> requires-python >=3.14.2), so
  # syntax newer than the floor can never ship silently. Floor and current
  # interpreter coincide today, which makes this leg a weak guard for now;
  # it regains its teeth the moment HA's Python floor moves past 3.14 and
  # this pin stays behind. Keep this pinned to the FLOOR, never "latest".
  syntax-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Compile all modules on Python 3.14
        run: |
          uv run --python 3.14 --no-project \
            python -m compileall -q custom_components/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Single entry by necessity, not by preference. The HA 2026.7.0
        # floor is the first release carrying UnitOfDensity/UnitOfRatio,
        # and it requires Python >=3.14.2. A 3.13 leg would resolve a
        # pre-2026.7 harness that lacks those enums and fail on import,
        # so it tests nothing we support. Add an entry back only when a
        # newer Python can still resolve a >=2026.7 harness.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Pytest on Python ${{ matrix.python-version }} (with coverage gate)
        run: |
          uv run --python ${{ matrix.python-version }} \
            --with pytest-homeassistant-custom-component \
            --with pytest-cov \
            python -m pytest tests/ -v \
              --cov=custom_components.visiblair \
              --cov-report=term-missing \
              --cov-fail-under=95

  # Proves the floor declared in hacs.json is real. The other gates resolve
  # the LATEST Home Assistant, so code could start depending on a newer API
  # while HACS keeps offering the release to users on the declared floor.
  # Reads the floor from hacs.json and the integration's own requirements
  # from manifest.json, then imports every module and type-checks against
  # that exact release.
  #
  # This is also the only mypy run. HA 2026.9 moved core to probatio and
  # 2026.10 retyped schema arguments as probatio.Schema, so mypy against the
  # latest HA rejects the voluptuous schemas older releases need (probatio
  # does not exist before 2026.9). HA still accepts voluptuous schemas at
  # runtime, and the test job covers runtime on the newest HA.
  minimum-supported-ha:
    name: Minimum supported HA (hacs.json floor)
    runs-on: ubuntu-latest
    env:
      # Must satisfy the floor's requires-python (HA 2026.7.0 = Python
      # 3.14.2+), and stay below 3.15: uv would otherwise pick CPython 3.15, where
      # HA 2026.7.0's pinned Pillow has no wheel.
      FLOOR_PYTHON: ">=3.14.2,<3.15"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Pin the floor and the integration's requirements
        run: |
          python3 - <<'PY'
          import json
          floor = json.load(open("hacs.json"))["homeassistant"]
          reqs = json.load(open("custom_components/visiblair/manifest.json"))["requirements"]
          with open("floor-requirements.txt", "w") as f:
              f.write("\n".join([f"homeassistant=={floor}", "voluptuous", *reqs]) + "\n")
          print(f"Declared Home Assistant floor: {floor}; requirements: {reqs}")
          PY

      - name: Import every module against the floor
        run: |
          uv run --no-project --python "$FLOOR_PYTHON" \
            --with-requirements floor-requirements.txt \
            python -c "
          import importlib, pkgutil
          import custom_components.visiblair as pkg
          names = [m.name for m in pkgutil.iter_modules(pkg.__path__)]
          for name in names:
              importlib.import_module(f'{pkg.__name__}.{name}')
          print(f'{len(names)} modules import on the declared floor')
          "

      - name: Mypy (strict) against the floor
        run: |
          uv run --no-project --python "$FLOOR_PYTHON" \
            --with-requirements floor-requirements.txt \
            --with mypy \
            mypy custom_components/visiblair/
